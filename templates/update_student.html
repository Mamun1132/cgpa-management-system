<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='update_student.css') }}">
</head>
<body>
    <div class="Header">            
        <div class="cgpa">CGPA Management</div>
        <p> <a href="{{ url_for('index') }}">Home</a></p> 
        <p> <a href="{{ url_for('add_student') }}">Add Student</a></p> 
        <p> <a href="{{ url_for('update_student') }}">Update Student</a></p> 
        <p> <a href="{{ url_for('delete_student') }}">Delete Student</a></p> 
        <p>  <a href="{{ url_for('view_students') }}">View Students</a></p> 
    </div>

    <h2>Update Student Information</h2>
    <form method="POST">
        <label>Student ID:</label>
        <input type="number" name="id" required><br>
        
        <label>Name:</label>
        <input type="text" name="name" required><br>
        
        {% for i in range(1, 9) %}
        <h3>Semester {{ i }}</h3>
        <label>CGPA:</label>
        <input type="number" step="0.01" name="sem{{ i }}_cgpa" required>
        <label>Credit:</label>
        <input type="number" name="sem{{ i }}_credit" required><br>
        {% endfor %}
    <div class="button-container">
        <button type="submit">Update Student</button>
        </div>
    </form>
</body>
</html>
